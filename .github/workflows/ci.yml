name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev,data]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Smoke demo
        run: flydrones demo --seconds 4
      - name: Browser engine matches Python
        run: node tools/check_web_engine.mjs
